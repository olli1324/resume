<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vault</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/vault/style.css">
</head>
<body>

<div id="login" class="skjerm">
  <form id="login-form" class="kort">
    <h1>Vault</h1>
    <p class="hjelp">Private notater fra Obsidian. Siden er lukket.</p>
    <label for="passord">Passord</label>
    <input id="passord" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Logg inn</button>
    <p id="login-feil" class="feil" hidden></p>
  </form>
</div>

<div id="app" class="ramme" hidden>
  <aside class="sidemeny">
    <header class="side-topp">
      <div class="tittel">
        <h1>Vault</h1>
        <button id="logg-ut" class="sekundar liten">Logg ut</button>
      </div>
      <input id="sok" type="search" placeholder="Søk i titler …" autocomplete="off">
      <p id="oppdatert" class="hjelp"></p>
    </header>
    <nav id="tre" class="tre"><p class="tom">Henter …</p></nav>
    <nav id="omriss" class="omriss" hidden></nav>
  </aside>

  <main id="notat" class="notat"></main>
</div>

<script type="module" src="/vault/app.js"></script>
</body>
</html>
